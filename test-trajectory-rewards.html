<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>With Little — Reward Garage &amp; Trajectory Tests</title>
<style>
  :root{--bg-page:#07101b;--text-primary:#f7fbff;--blue:#35a3ff;--green:#44d18d;--red:#ff8290}
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:var(--bg-page);color:var(--text-primary)}
  h1{font-family:Georgia,serif;color:var(--blue)}
  .pass{color:var(--green)}.fail{color:var(--red)}
  li{margin:6px 0}
</style>
</head>
<body>
<h1>With Little — Reward Garage &amp; Trajectory Tests</h1>
<p id="status">Running…</p>
<ul id="results"></ul>
<script src="stewardship-store.js?v=3"></script>
<script src="rewards-store.js?v=1"></script>
<script src="trajectory-store.js?v=1"></script>
<script>
(async function(){
  const ul = document.getElementById('results');
  const status = document.getElementById('status');
  function row(r){ ul.innerHTML += '<li class="'+(r.pass?'pass':'fail')+'">'+(r.pass?'PASS':'FAIL')+': '+r.name+(r.detail?' — '+r.detail:'')+'</li>'; }
  try{
    const rewards = await runRewardStoreTests();
    const traj = await runTrajectoryStoreTests();
    const stew = await runStewardshipStoreTests();
    rewards.results.forEach(row);
    traj.results.forEach(row);
    stew.results.forEach(row);
    status.textContent = rewards.pass && traj.pass && stew.pass ? 'Done.' : 'Failed.';
  }catch(e){
    status.textContent = 'Error: '+e.message;
  }
})();
</script>
</body>
</html>
